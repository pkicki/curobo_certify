[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curobo-certify"
version = "0.1.0"
description = "Reference certification campaign for unchanged cuRobo TimeOpt paths"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "scipy>=1.13,<2"]

[project.optional-dependencies]
upstream = ["curobo @ git+https://github.com/NVlabs/curobo.git@c301cb00a87012c2808b1a60649c4065c9b3c95a"]

[tool.setuptools.packages.find]
where = ["src"]
